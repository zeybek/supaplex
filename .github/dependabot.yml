# The crates have no dependencies, so for Rust only the compiler is updated.
# A new compiler can build other bytes, so run `npm run generate` on its pull
# request for CI to pass.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
